<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#d6ebea" />
    <meta name="description" content="Live weather dashboard: current conditions, map, air quality and tomorrow's forecast." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Geist:wght@300..700&display=swap"
      rel="stylesheet"
    />
    <title>Nimbus · Weather</title>
    <script>
      // Apply the saved theme before first paint to avoid a light flash in dark mode.
      try {
        var t = JSON.parse(localStorage.getItem('nimbus.theme') || '"system"')
        var dark = t === 'dark' || ((t === 'system' || t === 'sun') && matchMedia('(prefers-color-scheme: dark)').matches)
        document.documentElement.dataset.theme = dark ? 'dark' : 'light'
        document.documentElement.style.colorScheme = dark ? 'dark' : 'light'
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
